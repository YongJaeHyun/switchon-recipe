<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>스위치온 레시피 스크린샷 5</title>
<style>
@font-face{font-family:"Pretendard";src:url("PretendardVariable-Regular.ttf") format("truetype");font-weight:100 900}
:root{--ink:#10291A;--green:#16A34A;--mint:#EEF8F1;--bezel:#141917}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
body{font-family:"Pretendard",sans-serif;position:relative;color:var(--ink)}
.ground{position:absolute;left:0;right:0;top:1040px;bottom:0;background:var(--mint)}
.ground::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--green);opacity:.18}
h1{position:absolute;left:130px;right:100px;top:132px;font-size:80px;line-height:1.24;font-weight:800;letter-spacing:-.022em;word-break:keep-all}
.phone{position:absolute;left:130px;top:430px;width:820px;height:1432px;border-radius:72px;background:var(--bezel);padding:18px;
 box-shadow:0 2px 0 1px #2b322e inset,0 50px 90px -20px rgba(16,80,40,.28),0 16px 34px rgba(0,0,0,.10)}
.screen{width:784px;height:1396px;border-radius:56px;overflow:hidden;background:#fafafa;position:relative}
.screen img{position:absolute;left:0;top:-8px;width:784px;height:auto;display:block}
</style></head>
<body>
<div class="ground"></div>
<h1>한 주를 정리해<br>다음 주 할 일까지</h1>
<div class="phone"><div class="screen"><img src="../raw/5-weekly-report.png" alt=""></div></div>
</body></html>
